services:
  webdav:
    build: .
    platform: linux/amd64
    container_name: webdav-oss
    restart: unless-stopped
    stop_grace_period: 30s
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:?请在 .env 中设置 OSS_BUCKET_NAME}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?请在 .env 中设置 OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?请在 .env 中设置 OSS_ACCESS_KEY_SECRET}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?请在 .env 中设置 OSS_ENDPOINT}
      WEBDAV_SERVER_NAME: ${WEBDAV_SERVER_NAME:-localhost}
      WEBDAV_USERNAME: ${WEBDAV_USERNAME:?请在 .env 中设置 WEBDAV_USERNAME}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:?请在 .env 中设置 WEBDAV_PASSWORD}
      WEBDAV_HTTPS_PORT: ${HTTPS_PORT:-9043}
      SSL_ENABLED: ${SSL_ENABLED:-true}
      OSS_MOUNT_TIMEOUT: ${OSS_MOUNT_TIMEOUT:-30}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./ssl:/etc/webdav/ssl:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-9090}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-9043}:443"
