ServerName ${WEBDAV_SERVER_NAME}
ServerTokens Prod
ServerSignature Off
TraceEnable Off
DavLockDB /var/lib/dav/lockdb
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

# 直接提供挂载点，包含启动后新增的文件和隐藏文件。
<Directory /mnt/ossfs>
    Options Indexes
    AllowOverride None
    DirectoryIndex disabled
    Dav On
    LimitRequestBody 0
    AuthType Basic
    AuthName "WebDAV"
    AuthUserFile /etc/apache2/webdav.passwd
    Require valid-user
</Directory>

<VirtualHost *:80>
    DocumentRoot /mnt/ossfs
    <IfDefine WEBDAV_TLS>
        # 使用配置的公网端口，并保留 WebDAV 请求方法和请求体。
        Redirect 307 / https://${WEBDAV_SERVER_NAME}:${WEBDAV_HTTPS_PORT}/
    </IfDefine>
</VirtualHost>

<IfDefine WEBDAV_TLS>
    <VirtualHost *:443>
        DocumentRoot /mnt/ossfs
        SSLEngine on
        SSLCertificateFile /etc/webdav/ssl/cert.pem
        SSLCertificateKeyFile /etc/webdav/ssl/key.pem
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SSLCipherSuite HIGH:!aNULL:!MD5
    </VirtualHost>
</IfDefine>
