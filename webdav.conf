# HTTP虚拟主机配置
<VirtualHost *:80>
    ServerName ${WEBDAV_SERVER_NAME}
    
    DocumentRoot /var/www/webdav
    
    ErrorLog /root/webdav-http-error.log
    CustomLog /root/webdav-http-access.log combined
    
    # 如果启用SSL，将HTTP请求重定向到HTTPS
    RewriteEngine Off
    RewriteCond %{HTTPS} off
    RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# HTTPS虚拟主机配置
<VirtualHost *:443>
    ServerName ${WEBDAV_SERVER_NAME}
    
    DocumentRoot /var/www/webdav
    
    ErrorLog /root/webdav-https-error.log
    CustomLog /root/webdav-https-access.log combined
    
    # SSL配置
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/webdav-cert.pem
    SSLCertificateKeyFile /etc/ssl/private/webdav-key.pem
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on
    
    <Directory /var/www/webdav>
        Options Indexes FollowSymLinks
        AllowOverride All
        
        Dav On
        
        AuthType Basic
        AuthName "WebDAV"
        AuthUserFile /etc/apache2/webdav.passwd
        Require valid-user
    </Directory>
    
    <IfModule mod_headers.c>
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Depth"
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS, PROPFIND, PROPPATCH, MKCOL, PUT, MOVE, COPY, DELETE, LOCK, UNLOCK"
    </IfModule>
    
    # These disable redirects on non-GET requests for directories that
    # don't include the trailing slash (for misbehaving clients).
    BrowserMatch "Microsoft Data Access Internet Publishing Provider" redirect-carefully
    BrowserMatch "MS FrontPage" redirect-carefully
    BrowserMatch "^WebDrive" redirect-carefully
    BrowserMatch "^WebDAVFS/1.[01234]" redirect-carefully
    BrowserMatch "^gnome-vfs/1.0" redirect-carefully
    BrowserMatch "^XML Spy" redirect-carefully
    BrowserMatch "^Dreamweaver-WebDAV-SCM1" redirect-carefully
    BrowserMatch " Konqueror/4" redirect-carefully
    BrowserMatch "^gvfs" redirect-carefully
</VirtualHost>
